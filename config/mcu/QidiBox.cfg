# QIDI Box controller (STM32F401xC, USB serial)
#
# Klipper converted box (mainline Klipper/Kalico firmware built for the STM32F401xC,
# 8 MHz crystal, USB on PA11/PA12, see docs/QIDI_Box.md for the bootloader offset):
#   ls /dev/serial/by-id/  ->  usb-Klipper_stm32f401xc_<id>-if00
# Stock QIDI firmware (QIDI's own Klipper fork on the box, V1 or V2 board):
#   ls /dev/serial/by-id/  ->  usb-Klipper_QIDI_BOX_V2_<version>_<id>-if00 (QIDI_BOX_V1 on V1)
# Keep the serial: line for your firmware and comment out the other.
[mcu QidiBox_1]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_<insert id>-if00
#serial: /dev/serial/by-id/usb-Klipper_QIDI_BOX_V2_<insert version and id>-if00
restart_method: command

[temperature_sensor QidiBox_1]
sensor_type: temperature_mcu
sensor_mcu: QidiBox_1

# Pins from QIDI's box1.cfg (QIDITECH/QIDI_PLUS4, QIDITECH/QIDI_Q2) and Happy Hare's
# QIDI Box board profile. The stepper drivers are standalone: there is no UART or DIAG pin and
# the motor current is set in hardware.
[board_pins QidiBox_1]
mcu: QidiBox_1
aliases:
    M1_STEP=PC14  , M1_DIR=PC13  , M1_EN=PC15  ,
    M2_STEP=PB9   , M2_DIR=PB8   , M2_EN=PC0   ,
    M3_STEP=PC12  , M3_DIR=PC11  , M3_EN=PD2   ,
    M4_STEP=PC8   , M4_DIR=PB2   , M4_EN=PC10  ,

    # Slot (entry) filament sensors, QIDI's runout_pin
    TRG1=PA0      , TRG2=PB3     , TRG3=PA13   , TRG4=PA7    ,
    # Shared hub (exit) sensor and the tension switch of the box's buffer
    HUB=PB1       , BUFFER=PB0   ,

    # Slot LEDs (white, red)
    LED1_W=PA1    , LED1_R=PA2   , LED2_W=PB4  , LED2_R=PB5  ,
    LED3_W=PA14   , LED3_R=PA15  , LED4_W=PC4  , LED4_R=PC5  ,

    # Dryer: heater, NTC 100K thermistors on the heater element, fans, AHT20 air sensor (I2C3)
    HEATER=PA3    , HEATER_TEMP_A=PC1, HEATER_TEMP_B=PC2,
    FAN_A=PA4     , FAN_B=PA5    , BOARD_FAN=PA6,
    AHT_SCL=PA8   , AHT_SDA=PC9  ,

    # NFC readers on SPI2: CS1 covers slots 1 and 2, CS2 slots 3 and 4. RST holds them in reset
    # until it is driven high.
    NFC_CS1=PC6   , NFC_CS2=PC7  , NFC_RST=PB12
