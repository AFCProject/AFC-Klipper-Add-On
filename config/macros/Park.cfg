[gcode_macro AFC_PARK]
description: Parks the toolhead at a specified XY location with optional Z hop
gcode:
  {% set gVars          = printer['gcode_macro _AFC_GLOBAL_VARS'] %}
  {% set travel_speed   = gVars['travel_speed']     | default(120)*60   | float %}
  {% set verbose        = gVars['verbose']          | default(1)        | int %}
  {% set z_travel_speed = gVars['z_travel_speed']   | default(30)*60    | float %}
  {% set vars           = printer['gcode_macro _AFC_PARK_VARS'].copy() %}
  {% set extruder       = params.EXTRUDER|default('') %}
  {% set _th_key        = 'gcode_macro _AFC_PARK_VARS_' ~ extruder %}
  {% if extruder and printer[_th_key] is defined %}
      {% set _ = vars.update(printer[_th_key]) %}
  {% endif %}
  {% set Px, Py         = vars.park_loc_xy          | default([-1,-1])  | map('float') %}
  {% set Px             = params.X                  | default(Px)       | float %}
  {% set Py             = params.Y                  | default(Py)       | float %}

  {% set z_hop          = vars['z_hop']             | default(0)        | float %}
  {% set z_hop          = params.Z_HOP              | default(z_hop)    | float %}

  {% set park_z         = vars['park_z']            | default(0.0)      | float %}

  {% set min_z = vars.get('min_z') %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% if min_z is none %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set z_offset = printer.gcode_move.homing_origin.z|float %}
  {% else %}
    {% if min_z > max_z %}
      {% set error_str = "AFC_PARK: min_z " ~ min_z ~ " exceeds machine Z limit " ~ max_z %}
      {action_raise_error(error_str)}
    {% endif %}
    {% set cur_z = printer.gcode_move.gcode_position.z %}
    {% set z_offset = printer.gcode_move.position.z - cur_z %}
  {% endif %}
  {% set z_safe = [cur_z + z_hop, max_z - z_offset]|min %}
  {% if min_z is not none %}
    {% set z_safe = [z_safe, min_z - z_offset]|max %}
  {% endif %}

  {% if verbose > 0 %}
    RESPOND TYPE=command MSG='AFC_Park: Park Toolhead'
  {% endif %}

  G90

  AFC_DISABLE_SKEW

  G1 Z{z_safe} F{z_travel_speed}
  {% set safe_loc_y = vars.get('safe_loc_y') %}
  {% if safe_loc_y is none %}
    G1 X{Px} Y{Py} F{travel_speed}
  {% else %}
    G1 Y{safe_loc_y} F{travel_speed}
    G1 X{Px} F{travel_speed}
    G1 Y{Py} F{travel_speed}
  {% endif %}

  AFC_ENABLE_SKEW

  # Reduce likeliness of unwanted oozing during filament unload / load prior to a poop
  {% if park_z > 0 and park_z < z_safe %}
  G1 Z{park_z} F{z_travel_speed}
  {% endif %}
