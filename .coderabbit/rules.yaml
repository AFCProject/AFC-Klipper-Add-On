rules:
  - id: python-unified-complex-condition
    language: python
    pattern: |
      (?x)
      (?P<expr>
        # Match standard if/while conditions
        (?:if|while)\s+[^\n:]+
        |
        # Match inline-if (ternary) expressions
        [^=\n]+?\s+if\s+[^:\n]+?\s+else\s+[^:\n]+
      )
    message: >
      Complex Python condition detected. Consider breaking this into named
      variables or restructuring the logic for clarity and maintainability.
    severity: warning

    triggers:
      # Expression is too long
      - condition: "len(expr) > 80"

      # Multiple boolean operators (Python-specific)
      - regex: "\b(and|or)\b.*\b(and|or)\b"

      # Nested parentheses
      - regex: "\([^()]*\([^()]+\)[^()]*\)"

      # Function calls inside conditions
      - regex: "[a-zA-Z_][a-zA-Z0-9_]*\s*\("

      # Chained comparisons (Python-only)
      - regex: "\b\w+\s*(<|>|<=|>=|==|!=)\s*\w+\s*(<|>|<=|>=|==|!=)\s*\w+"

  - id: python-test-enforcement
    language: python
    message: >
      This PR adds or modifies Python classes/functions without corresponding
      unit tests. New code must include new tests, and modified code must update
      existing tests to reflect behavior changes.

    severity: error

    pattern: |
      (?x)
      (?P<entity>
        ^\s*(class|def)\s+[A-Za-z_][A-Za-z0-9_]*    # new or modified class/function
      )

    triggers:
      # Trigger when code is added but no test file is touched
      - condition: "not any(f.startswith('tests/') for f in files_changed)"

      # Trigger when a Python file is added or modified but no test file changed
      - condition: |
          any(f.endswith('.py') and not f.startswith('tests/') for f in files_changed)
          and not any(f.startswith('tests/') for f in files_changed)

      # Trigger when a specific class/function changed but its test file did not
      - condition: |
          entity_name = entity.split()[1]
          not any(entity_name.lower() in f.lower() for f in files_changed if f.startswith('tests/'))

