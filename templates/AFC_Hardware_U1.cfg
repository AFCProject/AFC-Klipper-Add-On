[force_move]
enable_force_move: True

[AFC_Toolchanger Tools]

[AFC_extruder e0]
#pin_tool_start: buffer
u1_filament_sensor_name: e0_filament
tool_stn: 50                    # See documentation for details on how to calculate this value. https://armoredturtle.xyz/docs/afc-klipper-add-on/toolhead/calculation.html
tool_stn_unload: 60             # See documentation for details on how to calculate this value. https://armoredturtle.xyz/docs/afc-klipper-add-on/toolhead/calculation.html
tool_sensor_after_extruder: 0   # Extra distance to move in mm once pre/post sensors are clear. Useful for when only using post sensor, so this distance can be the amount to move to clear extruder gears
tool_unload_speed: 25           # Unload speed in mm/s when unloading toolhead. Default is 25mm/s.
tool_load_speed: 25             # Load speed in mm/s when loading toolhead. Default is 25mm/s.
toolchanger_unit: Tools
custom_tool_swap : PICK_EXTRUDER
custom_unselect : PARK_EXTRUDER
u1_park_detector_name: extruder
extruder_name: extruder
custom_load_cmd: AFC_STANDALONE_LOAD_U1
feed_module: left               # left feeder (e1/e0); use right for e2/e3
feed_channel: e0                # the get_status channel key for this lane

