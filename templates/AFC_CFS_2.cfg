#--=================================================================================--#
######### Second Creality CFS on the same chain #########################################
#--=================================================================================--#
# Wiring (K1 kit): printer -> USB/RS-485 adapter -> CFS 1 IN, CFS 1 OUT -> CFS 2 IN
# (up to four boxes). Each box's filament tube goes to its own input on the
# 4-in-1 buffer, so every box shares the buffer as AFC's hub.
#
# Copy next to AFC_CFS_1.cfg. Then:
#   1. Run AFC_CFS_STATUS UNIT=CFS_1 with only box 1 connected and copy its
#      "box uid" into box_uid in AFC_CFS_1.cfg.
#   2. Connect box 2, power-cycle both boxes, restart Klipper. Discovery gives
#      the new box a spare address and logs its uid ("isn't in any [AFC_CFS]
#      section"); put that uid in box_uid below and restart once more.
#   3. Power-cycle the boxes again so both are addressed by uid.
# Without box_uid on every box, the boxes are addressed in the order they
# answer, which can change between power-ups and swap your lanes.

[AFC_CFS CFS_2]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   # SAME port as CFS_1
box_addr: 2
box_uid: 000000000000000000000000   # replace with this box's uid (step 2 above)
hub: CFS_1                          # the shared buffer, defined in AFC_CFS_1.cfg
extruder: extruder
# Its own trace file (the wire traffic goes to the first box's trace)
trace_file: /usr/data/printer_data/logs/cfs2_trace.jsonl
# No cutter_sensor_pin here: the cutter is on the toolhead and Klipper allows the
# pin once, so this box uses the one set on CFS_1.
#rfid_read: False                # RFID tags, as in AFC_CFS_1.cfg

[AFC_lane lane5]
unit: CFS_2:1                    # Slot A of box 2 -> T4
[AFC_lane lane6]
unit: CFS_2:2                    # Slot B -> T5
[AFC_lane lane7]
unit: CFS_2:3                    # Slot C -> T6
[AFC_lane lane8]
unit: CFS_2:4                    # Slot D -> T7
