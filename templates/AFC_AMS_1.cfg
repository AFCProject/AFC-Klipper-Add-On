[mcu fps]
canbus_uuid: <replace with your can UUID>

[mcu oams_mcu1]
canbus_uuid: <replace with your can UUID>


[AFC_OAMS OAMS1]
mcu:oams_mcu1
load_retry_max: 3              # How many times to retry a failed load
unload_retry_max: 2            # How many times to retry a failed unload
retry_delay: 6.0
auto_unload_on_failed_load: True   # Unload automatically before retrying a failed load


# The FPS (filament pressure sensor) reads 0 when its spring is fully
# relaxed and 1 when fully compressed. Below fps_lower_threshold the hub
# motor stops; above fps_upper_threshold it runs full speed; in between,
# it's driven to hold the midpoint (here (0.7 + 0.3) / 2 = 0.5) as the
# filament pressure target.
fps_upper_threshold:          0.7  # Above this, the hub motor runs full speed
fps_lower_threshold:          0.3  # Below this, the hub motor stops

# Move the FPS slide by hand and watch the buffer state in Mainsail/Fluidd.
# If it shows the opposite of what you're doing, set fps_is_reversed to true.
fps_is_reversed: false

# How full each spool bay's first-stage sensor (0.0-1.0) needs to read for
# that bay to count as "loaded".
f1s_hes_on: 0.1, 0.1, 0.1, 0.1
# If true, a bay counts as empty above f1s_hes_on instead of below it.
f1s_hes_is_above: false

# Calibrate these with OAMS_CALIBRATE_HUB_HES. Above these values, that
# bay's hub sensor is considered ON.
hub_hes_on: 0.825845, 0.8075905442237854, 0.837821, 0.813116
hub_hes_is_above: true

# How far (mm) the OAMS feeds filament before checking the FPS slide to
# know when to stop loading: once fed ptfe_length - 100mm, it slows down
# and checks whether the slide has reached fps_upper_threshold, meaning the
# filament has reached the toolhead gears. This value is critical and must
# match your machine's PTFE tube length - see the startup checklist above.
# If loads stop too early or too late, check for kinks or excess friction
# in the PTFE tubing first - a stiffer spring is included with the OpenAMS
# kit for longer tube runs.
ptfe_length: 2820

# Controls spool rewind: hub motor speed is adjusted so the first-stage
# motor current tracks current_target (0.0-1.0). Leave these alone unless
# you have a specific reason to change them.
current_target: 0.30
current_kp: 3.0   # PID values for the rewind loop
current_ki: 0.0
current_kd: 0.0

# This unit's number (1, 2, ...) - used to name filament groups (oams1,
# oams2, ...) and to tell multiple AMS units apart in klippy.log and the
# canbus_logger.py debug script.
oams_idx: 1


[AFC_OpenAMS AMS_1]
oams: OAMS1
hub: AMS_1
extruder: extruder
buffer: FPS_buffer1
stuck_spool_auto_recovery: True
clog_sensitivity: medium   # off, low, medium, or high - medium is a good starting point

[AFC_lane lane0]
unit: AMS_1:1
load_to_hub: False

[AFC_lane lane1]
unit: AMS_1:2
load_to_hub: False

[AFC_lane lane2]
unit: AMS_1:3
load_to_hub: False

[AFC_lane lane3]
unit: AMS_1:4
load_to_hub: False

[AFC_hub AMS_1]
# Length (mm) of the Bowden tube from the hub to the toolhead sensor.
# Should match the OAMS ptfe_length above.
afc_bowden_length: 2820
switch_pin: virtual

[AFC_buffer FPS_buffer1]
type: FPS_PSF
adc_pin: fps:PA2
set_point: 0.5
filament_error_sensitivity: 3.0  # 0-10 scale; 0 disables the check
multiplier_high: 1.15
multiplier_low: 0.85

[temperature_oams]

[temperature_sensor oams1]
sensor_type: temperature_oams
i2c_address: 64
i2c_mcu: oams_mcu1
i2c_bus: i2c0
i2c_speed: 200000
temp_offset: 0.0
humidity_offset: 0.0
temp_resolution: 14
humidity_resolution: 14
