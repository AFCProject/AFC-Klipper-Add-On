### Fan and Temperature
[controller_fan emu_fan_lane1]
pin: emu_lane1:FAN
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane1

[temperature_sensor lane1]
sensor_type: BME280
i2c_address: 118
# If using AHT20 sensor, comment out sensor type and i2c address above and uncomment
# the code below
#sensor_type: AHT2X
#i2c_address: 56
i2c_mcu: emu_lane1
i2c_software_scl_pin: emu_lane1:TEMP_SCL
i2c_software_sda_pin: emu_lane1:TEMP_SCA
# If using SLB board and would like to use hardware I2C, comment out software SCL/SDA pins
# and uncomment i2c_bus below
#i2c_bus: i2c2_PB10_PB11

[temperature_sensor emu_mcu_lane1]
sensor_type: temperature_mcu
sensor_mcu: emu_lane1


############### HUB/Buffer ###############

[AFC_buffer EMU_1_buffer]
advance_pin: ^emu_lane1:BUFFER_ADV
trailing_pin: ^emu_lane1:BUFFER_TRL
multiplier_high: 1.15
multiplier_low: 0.90

#[AFC_buffer EMU_1_PSF_buffer1]
#type: emu_lane1:TH
#adc_pin: PA0
#neutral_point: 0.5
#max_tension: 0.1
#max_compression: 0.9
#reversed: false  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.

# EMU hub is defaulted to hub without no sensor, if using a hub with a sensor
# please change the following:
#  - replace "virtual" with actual sensor pin. When changing to a actual pin
#  - update dist_hub variable in each AFC_stepper section to be around what
#    the PTFE length is between the load sensor and hub sensor.
#  - remove/comment out `use_dist_hub: True` line

[AFC_hub EMU_HUB_1]
afc_bowden_length: 2000     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
hub_clear_move_dis: 5
switch_pin: virtual
use_dist_hub: True
