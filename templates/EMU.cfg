# EMU single-lane reference template.
# The installer generates a complete multi-lane config from this layout.
# MCU name, lane numbers, and unit name are substituted at install time.

[include mcu/EMU_EMU_1.cfg]

[AFC_EMU EMU_1]
hub: EMU_1_HUB
extruder: extruder
buffer: EMU_1_buffer
# The following speeds below are conservative, speeds have been tested up to 500mm/s, recommended
# running speeds at 400mm/s or less.
long_moves_speed: 250
long_moves_accel: 120
#long_moves_speed: 300
#long_moves_accel: 300

[mcu emu_lane1]
canbus_uuid: <replace with your can UUID>
#canbus_interface: can1         # Uncomment if using a CAN bus other than can0
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[AFC_stepper lane1]
unit: EMU_1:1
step_pin: emu_lane1:MOT_STEP
dir_pin: emu_lane1:MOT_DIR
enable_pin: !emu_lane1:MOT_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 2000
led_index: EMU_Indicator_1:1
led_spool_index: EMU_Indicator_1:2
# If using SLB board comment out the about led_index and led_spool_index and
# uncomment the indexes below. Then commend out [AFC_led EMU_Indicator_1] configuration
# section and uncomment both [AFC_led EMU_Indicator_Button_1] and [AFC_led EMU_Indicator_Box_1]
# configuration sections.
#led_index: EMU_Indicator_Button_1:1-4
#led_spool_index: EMU_Indicator_Box_1:1
prep: ^!emu_lane1:TRG
load: ^emu_lane1:LOAD
print_current: 0.4

[tmc2209 AFC_stepper lane1]
uart_pin: EMU_1_lane1:MOT_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane1]
pin: ^!emu_lane1:BUTTON

# Based on your configuration, LED configuration must be selected from the below:

