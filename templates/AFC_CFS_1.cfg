#--=================================================================================--#
######### Creality CFS (Color Filament System) ##########################################
#--=================================================================================--#
# IN TESTING. Read docs/CFS.md and follow its staged test plan before printing.
#
# One CFS box, four slots (A-D left to right) mapped to lane1-lane4.
# More boxes on the same chain: see AFC_CFS_2.cfg.
# Written for a K1 / K1 Max with the CFS upgrade kit (CFS extruder + cutter),
# running Simple AF or another mainline Klipper/Kalico stack. Creality's
# box.py / box_wrapper.so are NOT used and must not be loaded alongside this.

[AFC_CFS CFS_1]
# The box's cable has a CH340 USB-RS485 adapter built in. Use the stable
# by-id path rather than /dev/ttyUSB0 (find it with: ls /dev/serial/by-id/).
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
#baud: 230400
#box_addr: 1                     # RS-485 address on the chain (1-4), assigned at power-up
#box_uid: b0313b4e8411b00645353230   # this box's ID (AFC_CFS_STATUS shows it); required with 2+ boxes
hub: CFS_1                       # the buffer; every box on the chain uses the same hub
extruder: extruder
#poll_interval: 1.0              # Seconds between box status polls when idle
#request_timeout: 0.8            # Seconds to wait for each reply to quick commands
#stage_timeout: 30               # Motor stages are answered only when the motion ends (K1: 3.7s load stage 0, 12.4s reel-back)
#checkin_timeout: 5              # Generic box check-ins during unload
#resync_timeout: 60              # After a motor command times out, wait this long for its late reply
#protocol_debug: False           # Log every frame (TX/RX) to AFC's debug log

# Trace recording: box traffic + load/unload/cut events with timings, as JSON
# lines. On while this is in testing; download it from Mainsail/Fluidd's
# Logs and summarize it with tools/cfs_trace_summary.py. Remove to turn off.
trace_file: /usr/data/printer_data/logs/cfs_trace.jsonl   # ~/printer_data/logs/... on a Pi
#trace_max_size: 5               # MB before rotating
#trace_backups: 1                # rotated copies kept (cfs_trace.jsonl.1, ...)
#trace_polls: False              # also record idle status polls (much bigger file)

# Optional: the cutter switch on the CFS toolhead kit, if wired to a Klipper MCU pin.
# When set, loads refuse to start with the blade down, and cuts are verified.
#cutter_sensor_pin: nozzle_mcu:PA8   # K1 Max CFS kit (box.cfg switch_pin)
# The K1 kit's switch closes near the END of the blade's travel, so a cut that
# never fires it didn't finish. Retry, then stop the unload (set False to only
# check the switch released).
#cutter_require_trigger: True

# --- Load sequence (defaults match the stock firmware's sequence) ---
#load_attempts: 2
#stage5_timeout: 60              # Max seconds for the box to reach the toolhead sensor
#stage5_stall_time: 8            # Abort early if the measuring wheel stops moving this long
#prime1_length: 10               # mm, extruder grab move before stage 6
#prime1_speed: 35                # mm/min
#prime2_length: 5                # mm, before stage 7
#prime2_speed: 10                # mm/min

# --- Unload sequence ---
#unload_retract_steps: 15:600, 45:1800   # mm:mm/min, pulls out of the gears after RETRUDE start
#unload_tip_wiggle: False        # Stock tip-forming wiggle; not needed with a cutter
#unload_timeout: 30
#heartbeat_interval: 1.5          # CMD_ONLINE_CHECK like stock; keeps the box's light from cycling red
#heartbeat_interval_printing: 10
#boot_wait: 20                   # PREP waits this long for a box that is still powering up

# --- RFID tags (Creality format) ---
# Read a spool's tag once when it goes into a slot (never during a print) and set
# the lane's color, material and weight, or its Spoolman spool if the tag holds an
# ID. AFC_CFS_READ_TAG LANE=<lane> reads one by hand. See docs/CFS.md, "RFID tags".
#rfid_read: False
#rfid_insert_delay: 10           # s after the spool is detected
#rfid_read_at_startup: False     # also read every full slot once after Klipper starts
                                 # (spools swapped while off); untagged slots can keep
                                 # the box busy ~1 min each
#rfid_materials: 00003=PETG      # extra Creality material codes (5 digits=MATERIAL, ...)

[AFC_hub CFS_1]
# Lanes merge inside the box; there is no hub switch.
switch_pin: virtual
afc_bowden_length: 0
#cut: False

# Lanes are plain AFC lanes; the CFS unit runs their loads and unloads.
[AFC_lane lane1]
unit: CFS_1:1                    # Slot A
#map: T0
[AFC_lane lane2]
unit: CFS_1:2                    # Slot B
#map: T1
[AFC_lane lane3]
unit: CFS_1:3                    # Slot C
#map: T2
[AFC_lane lane4]
unit: CFS_1:4                    # Slot D
#map: T3

# The toolhead side lives in AFC_Hardware.cfg (created by AFC's installer),
# NOT here: [include AFC/*.cfg] loads files alphabetically, so an
# [AFC_extruder extruder] section in this file would be silently overridden by
# AFC_Hardware.cfg. Set these in AFC_Hardware.cfg's [AFC_extruder extruder]:
#
#   pin_tool_start: <CFS kit toolhead sensor pin>
#       Simple AF removes [filament_switch_sensor filament_sensor_2] from
#       printer.cfg during install; use that section's switch_pin from your
#       stock config backup. Don't keep a filament_switch_sensor on that pin.
#   tool_stn: 60
#       Sensor-to-nozzle distance. The CFS load already pushes
#       prime1_length + prime2_length (15mm) past the sensor; only the rest is
#       moved afterwards. Measure it: see docs/CFS.md.
#   tool_stn_unload: 0           # unload is driven by unload_retract_steps instead
#   tool_load_speed: 10
#
# In AFC.cfg, [AFC], edit these existing lines (line numbers in a fresh install;
# don't add second copies, Klipper uses the last one):
#   line 17   default_material_temps: default: 220, ...  # stock CFS purges at 220 (box.cfg Tn_extrude_temp)
#   line 84   tool_cut: True
#   line 86   tool_cut_cmd: AFC_CUT    # with pin_loc_xy / cut_direction etc. in AFC_Macro_Vars.cfg
#                                      # set to YOUR measured cutter lever position
#   line 89   park: True               # park over the purge chute before loads (stock primes 15mm)
#   line 90   park_cmd: AFC_CFS_PARK   # the macro below, NOT AFC_PARK (see why there)
#   line 93   poop: True               # purge after a color change
#   line 97   kick: False
#   line 101  wipe: False              # True only with wipe_cmd set to a wipe macro of your own
#   line 113  post_load_macro: AFC_CFS_LEAVE_PURGE    # uncomment; leave the chute before AFC lowers Z
#   line 116  post_unload_macro: AFC_CFS_LEAVE_PURGE  # uncomment (macro below; see why there)
# and in AFC_Macro_Vars.cfg, [gcode_macro _AFC_POOP_VARS]:
#   line 164  variable_purge_loc_xy: <same as park_x, park_y below>
#   line 166  variable_z_purge_move: False # purge at the parked height; True drops to Z 0.6 on the bed
# The full list with K1 and K1 Max values (cutter, purge, park) is in docs/CFS.md,
# "Lines to change in AFC's own files".
# See docs/CFS.md for K1-series starting values taken from Creality's box.cfg.

# Park over the CFS purge chute without ever going below a safe Z.
# AFC_PARK can only raise Z relative to the current height, so a load near the
# bed (first load of a print, or right after homing) would reach the chute at
# Z ~0-2. On a K1 the purge mechanism collides with the bed there; Creality's
# own box.cfg loads at extrude_pos_z: 30. This raises Z to at least min_z
# (never lowers it), then moves over the chute.
#
# The back strip of the printer holds the cutter lever and the nozzle wiper,
# so instead of a diagonal it travels sideways in front of safe_y (box.cfg
# safe_pos_y), then goes straight back: forward to safe_y if behind it,
# across in X, then back in Y.
[gcode_macro AFC_CFS_PARK]
description: Park over the CFS purge chute at a safe height
# K1 stock values from box.cfg (extrude_pos_x/y/z, safe_pos_y)
variable_park_x: 148.0
variable_park_y: 225.3
variable_min_z: 30.0
variable_safe_y: 215.0
variable_travel_speed: 250       # mm/s
variable_z_speed: 15             # mm/s
gcode:
  {% set cur_z = printer.gcode_move.gcode_position.z|float %}
  {% set cur_x = printer.gcode_move.gcode_position.x|float %}
  {% set cur_y = printer.gcode_move.gcode_position.y|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set safe_z = [[cur_z, min_z]|max, max_z]|min %}
  {% set f_xy = travel_speed * 60 %}
  G90
  {% if safe_z > cur_z %}
    G1 Z{safe_z} F{z_speed * 60}
  {% endif %}
  {% if (cur_x - park_x)|abs > 0.1 %}
    {% if cur_y > safe_y %}
      G1 Y{safe_y} F{f_xy}
    {% endif %}
    G1 X{park_x} F{f_xy}
  {% endif %}
  G1 Y{park_y} F{f_xy}
  M400

# Leave the purge chute before AFC puts the toolhead back.
# After a load AFC restores the saved position Z first: the bed rises to the
# saved height + z_hop while the toolhead is still parked over the chute, and
# on a K1 the bed comes up into the purge hopper before it springs back. Run
# from AFC's post_load_macro / post_unload_macro, this moves straight forward
# to safe_y at the current height and waits for the hopper to settle, so the
# Z move happens clear of it. Does nothing if the toolhead is already in front
# of safe_y or not homed.
[gcode_macro AFC_CFS_LEAVE_PURGE]
description: Move forward out of the CFS purge chute area
variable_settle_ms: 1000         # time for the purge hopper to spring back
gcode:
  {% set park = printer["gcode_macro AFC_CFS_PARK"] %}
  {% if "y" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.y|float > park.safe_y|float %}
      SAVE_GCODE_STATE NAME=_afc_cfs_leave
      G90
      G1 Y{park.safe_y} F{park.travel_speed * 60}
      M400
      G4 P{settle_ms}
      RESTORE_GCODE_STATE NAME=_afc_cfs_leave
    {% endif %}
  {% endif %}
