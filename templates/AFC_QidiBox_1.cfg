# QIDI Box (4 slots and a filament dryer, sold for the QIDI Plus4, Q2 and Max4)
#
# The box is a Klipper MCU on USB. Its slot motors are normal [AFC_stepper] lanes that AFC
# drives itself, so loads, unloads, ejects and PREP work like on a Box Turtle. Pins are in
# mcu/QidiBox_1.cfg next to this file: the installer copies it there from config/mcu/QidiBox.cfg
# in the AFC repo. For a manual install, copy that file to <your AFC config folder>/mcu/
# QidiBox_1.cfg yourself. Full guide: docs/QIDI_Box.md in the AFC repo.
#
# Before the first boot:
#   1. Set serial: in mcu/QidiBox_1.cfg (ls /dev/serial/by-id/). Set up for either firmware:
#      Klipper converted box: mainline Klipper or Kalico firmware, the default below.
#      Stock QIDI firmware: use the stock serial path in mcu/QidiBox_1.cfg and the hardware
#      I2C bus at the dryer air sensor below. The installer's "QIDI Box Firmware: Stock"
#      choice does both.
#   2. Pick the mode:
#      hub:    stock box, the four slots merge inside the box into one outlet with a hub
#              sensor, feeding ONE extruder. This is what the file is set up for.
#      direct: the box's merger is bypassed and each slot has its own tube to its OWN
#              extruder, e.g. one lane per tool on a toolchanger. Each lane's load sensor is
#              then a sensor on the printer side. See the commented lines in each lane.
#   3. Check the [AFC_extruder] each lane feeds (AFC_Hardware.cfg) has a toolhead sensor.
# After boot:
#   4. Insert a spool in each slot and check AFC shows the lane loaded. If a sensor reads
#      inverted, flip the ! on its pin.
#   5. Run AFC_CALIBRATION to measure dist_hub and afc_bowden_length.

[include mcu/QidiBox_1.cfg]

[AFC_QidiBox QidiBox_1]
hub: QidiBox_1                      # direct mode: comment this out
extruder: extruder                  # the [AFC_extruder] fed; a lane can override
#buffer: <buffer_name>              # optional [AFC_buffer] between box and toolhead
#max_short_moves: 40                # prep/eject give up after this many short_move_dis
                                    # moves. Raise it in direct mode when the printer side
                                    # load sensor is far from the box.
#preload_park_dist: 80              # hub mode: a new spool is fed to the hub sensor, then
                                    # parked this far (mm) before it. Turn the feed off per
                                    # lane with load_to_hub: False.

# ---- Dryer ----
# AFC_QIDIBOX_DRY UNIT=QidiBox_1 TEMP=<C> DURATION=<minutes> [ROTATE=1]
# AFC_QIDIBOX_DRY_STOP UNIT=QidiBox_1
# ROTATE=1 turns the spools while drying, like QIDI's firmware: every dry_rotate_interval
# seconds each lane with no filament at its sensors retracts dry_rotate_length mm, which turns
# its spool on the rollers. Unload a lane (tip secured to the spool) to dry it with rotation.
dryer_heater: QidiBox_1_dryer
dryer_humidity_sensor: aht10 QidiBox_1_dryer_air
#dryer_max_temp: 65                 # C, AFC_QIDIBOX_DRY never heats above this. QIDI's
                                    # material table tops out at 65 C, its firmware caps the
                                    # air at 90 C (the most this accepts). Printed spool
                                    # adapters can soften above about 60 C.
#dryer_default_temp: 50             # C, used when TEMP is left out
#dryer_default_duration: 240        # minutes, used when DURATION is left out
#dry_rotate_length: 50              # mm retracted per turn
#dry_rotate_speed: 80               # mm/s
#dry_rotate_interval: 300           # seconds between turns

# Hub mode: the box's shared outlet sensor
[AFC_hub QidiBox_1]
switch_pin: ^!QidiBox_1:HUB
afc_bowden_length: 900              # mm from the hub sensor to the toolhead sensor, set by
                                    # AFC_CALIBRATION
move_dis: 50
cut: False

# unit: is <unit name>:<slot 1-4>, slot 1 is the left one.
# Hub mode: the slot sensor is the lane's only sensor, so it goes in load: and the lane has no
#   prep:. dist_hub is the length from the slot sensor to the hub sensor.
# Direct mode: the slot sensor moves to prep:, load: is the printer side sensor of that lane's
#   extruder, hub: direct, and dist_hub is the length from that load sensor to the toolhead
#   sensor.
[AFC_stepper lane1]
unit: QidiBox_1:1
step_pin: QidiBox_1:M1_STEP
dir_pin: QidiBox_1:M1_DIR
enable_pin: !QidiBox_1:M1_EN
microsteps: 16
rotation_distance: 13.6             # QIDI ships 13.4 (Plus4) and 13.8 (Q2), calibrate yours
step_pulse_duration: 0.000000100
load: !QidiBox_1:TRG1
dist_hub: 200
#prep: !QidiBox_1:TRG1              # direct mode
#load: ^<printer side sensor pin>   # direct mode
#hub: direct                        # direct mode
#extruder: extruder                 # direct mode: this lane's own tool
#dist_hub: 700                      # direct mode

[AFC_stepper lane2]
unit: QidiBox_1:2
step_pin: QidiBox_1:M2_STEP
dir_pin: QidiBox_1:M2_DIR
enable_pin: !QidiBox_1:M2_EN
microsteps: 16
rotation_distance: 13.6
step_pulse_duration: 0.000000100
load: !QidiBox_1:TRG2
dist_hub: 200
#prep: !QidiBox_1:TRG2
#load: ^<printer side sensor pin>
#hub: direct
#extruder: extruder1
#dist_hub: 700

[AFC_stepper lane3]
unit: QidiBox_1:3
step_pin: QidiBox_1:M3_STEP
dir_pin: QidiBox_1:M3_DIR
enable_pin: !QidiBox_1:M3_EN
microsteps: 16
rotation_distance: 13.6
step_pulse_duration: 0.000000100
load: !QidiBox_1:TRG3
dist_hub: 200
#prep: !QidiBox_1:TRG3
#load: ^<printer side sensor pin>
#hub: direct
#extruder: extruder2
#dist_hub: 700

[AFC_stepper lane4]
unit: QidiBox_1:4
step_pin: QidiBox_1:M4_STEP
dir_pin: QidiBox_1:M4_DIR
enable_pin: !QidiBox_1:M4_EN
microsteps: 16
rotation_distance: 13.6
step_pulse_duration: 0.000000100
load: !QidiBox_1:TRG4
dist_hub: 200
#prep: !QidiBox_1:TRG4
#load: ^<printer side sensor pin>
#hub: direct
#extruder: extruder3
#dist_hub: 700

# ---- Dryer hardware ----
# Air temperature and humidity: AHT20 on PA8 (SCL) / PC9 (SDA). Klipper's AHT driver reports
# every aht10_report_time seconds (5 at the fastest), too slow to drive a heater directly
# (Klipper's heater needs a reading every 3 s), so the heater reads it through
# temperature_combined, which re-reports it every 0.3 s.
# The sensor is on the box's hardware bus i2c3. The Klipper converted box reads it as software
# I2C on the same pins (hardware i2c3 errors can shut a converted box's MCU down). Stock QIDI
# firmware: QIDI reads it on the hardware bus, comment out the two software pins and uncomment
# i2c_bus.
[temperature_sensor QidiBox_1_dryer_air]
sensor_type: AHT2X
i2c_mcu: QidiBox_1
i2c_software_scl_pin: QidiBox_1:AHT_SCL
i2c_software_sda_pin: QidiBox_1:AHT_SDA
#i2c_bus: i2c3
aht10_report_time: 5
min_temp: -20
max_temp: 100                       # Klipper shuts down if the box air goes above this

[heater_generic QidiBox_1_dryer]
heater_pin: QidiBox_1:HEATER
sensor_type: temperature_combined
sensor_list: temperature_sensor QidiBox_1_dryer_air
combination_method: mean
maximum_deviation: 50
max_power: 1.0
control: pid                        # QIDI's values, tuned on its own faster sensor driver:
pid_Kp: 63.418                      # run PID_CALIBRATE HEATER=QidiBox_1_dryer TARGET=55
pid_Ki: 1.342
pid_Kd: 749.125
min_temp: -20
max_temp: 100

[verify_heater QidiBox_1_dryer]
max_error: 400
check_gain_time: 600

# Thermistors on the heater element. Klipper shuts down if either reads above 130 C, QIDI's
# limit for the element.
[temperature_sensor QidiBox_1_heater_a]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: QidiBox_1:HEATER_TEMP_A
min_temp: -20
max_temp: 130

[temperature_sensor QidiBox_1_heater_b]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: QidiBox_1:HEATER_TEMP_B
min_temp: -20
max_temp: 130

# shutdown_speed 0: all fans starting at full speed on a Klipper shutdown can brown out the
# box's USB connection
[heater_fan QidiBox_1_dryer_fan_a]
pin: QidiBox_1:FAN_A
heater: QidiBox_1_dryer
heater_temp: 35
shutdown_speed: 0

[heater_fan QidiBox_1_dryer_fan_b]
pin: QidiBox_1:FAN_B
heater: QidiBox_1_dryer
heater_temp: 35
shutdown_speed: 0

# Board fan, runs with the slot motors and the dryer (the board sits inside the heated box)
[controller_fan QidiBox_1_board_fan]
pin: QidiBox_1:BOARD_FAN
heater: QidiBox_1_dryer
stepper: AFC_stepper lane1, AFC_stepper lane2, AFC_stepper lane3, AFC_stepper lane4
shutdown_speed: 0
