# Adds an AFC_button on lane1 to afc_with_lane.cfg, so its button_callback
# can be invoked directly via SIMULATE_CALLBACK (no physical button here).

[include afc_with_lane.cfg]

[save_variables]
filename: /tmp/afc_klippy_callback_sim_test.cfg

[AFC]
VarFile: /tmp/afc_klippy_callback_sim_test.var

[AFC_button lane1]
pin: PD0
long_press_duration: 1.2
