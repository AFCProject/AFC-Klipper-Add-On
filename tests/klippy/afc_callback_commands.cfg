# Adds [virtual_sdcard] to afc_with_lane.cfg so SDCARD_RESET_FILE's
# "virtual_sdcard:reset_file" event exercises AFC._reset_file_callback's
# gcmd="callback" path.

[include afc_with_lane.cfg]

[save_variables]
filename: /tmp/afc_klippy_callback_test.cfg

[AFC]
VarFile: /tmp/afc_klippy_callback_test.var

[virtual_sdcard]
path: /tmp
