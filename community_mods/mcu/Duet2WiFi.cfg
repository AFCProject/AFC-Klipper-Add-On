# Duet 2 WiFi (SAM4E8E) pin aliases for Box Turtle AFC — Turtle_1 MCU
# Compatible with all Duet 2 WiFi hardware revisions (v1.00-v1.04) — identical pin mapping
#
# Driver type  : TMC2660 (SPI via usart1) — on-board drivers, NOT TMC2209/UART
# Shared enable: !PC6 (TMC_EN, active low — same as standard Duet WiFi wiring)
# NEMA14 slots : E1, X, Y, Z (on-board motor connectors)
# E2-E5 slots  : used for N20 respooler control via 50-pin expansion connector
#
# ── Required changes in AFC_Turtle_1.cfg for this board ──────────────────────
# Four things differ from a standard AFC install (AFC-Lite board):
#
#   1. Include line (line 1 of AFC_Turtle_1.cfg):
#        [include mcu/Duet2WiFi.cfg]        ← this file (not AFC_Lite.cfg)
#
#   2. Driver sections — one per lane, [tmc2660] NOT [tmc2209]:
#        [tmc2660 AFC_stepper lane1]
#        cs_pin: Turtle_1:M1_CS
#        spi_bus: usart1
#        run_current: 0.8
#        sense_resistor: 0.1
#        ↑ TMC2660 uses SPI. There is no UART. [tmc2209] with uart_pin will fail at boot.
#
#   3. Enable pin — shared across all lanes (Duet WiFi has one TMC_EN pin for all drivers):
#        enable_pin: !Turtle_1:STEPPER_EN   ← NOT !Turtle_1:M1_EN / M2_EN / M3_EN / M4_EN
#        One alias only (STEPPER_EN=PC6). Klipper rejects duplicate aliases for the same pin.
#
#   4. Hardware PWM — use software PWM for N20 respoolers:
#        hardware_pwm: False                ← NOT True (AFC-Lite default)
#        Software PWM is sufficient for N20 speed control and avoids timer conflicts.
#
#   All other config (stepper pins, sensors, LEDs, hub) is identical to any
#   Box Turtle build — the alias names below are the same interface as AFC_Lite.cfg.
# ─────────────────────────────────────────────────────────────────────────────

[board_pins Turtle_1]
mcu: Turtle_1
aliases:
    # ── NEMA14 Steppers ──────────────────────────────────────────────────────────
    # On-board motor connectors, TMC2660 SPI (spi_bus: usart1), shared enable !PC6
    M1_STEP=PD4,  M1_DIR=PD9,  M1_CS=PC25,               # Lane 1 → E1 connector
    M2_STEP=PD6,  M2_DIR=PD11, M2_CS=PD14,              # Lane 2 → X  connector
    M3_STEP=PD7,  M3_DIR=PD12, M3_CS=PC9,               # Lane 3 → Y  connector
    M4_STEP=PD8,  M4_DIR=PD13, M4_CS=PC10,              # Lane 4 → Z  connector
    STEPPER_EN=PC6,                                       # TMC_EN shared enable, active low (all 4 lanes)
    # NOTE: ONE alias only for the shared enable pin — Klipper rejects duplicate aliases for the same
    # physical pin (e.g. M1_EN=PC6 + M2_EN=PC6 → error "pin M2_EN is an alias for M1_EN").
    # All [AFC_stepper] sections must reference the same alias: enable_pin: !Turtle_1:STEPPER_EN

    # ── N20 Respoolers ───────────────────────────────────────────────────────────
    # 50-pin expansion connector — all 4 pins of each E2-E5 drive group used per lane:
    # MOT_RWD = E?_DIR  pin → AIN1/BIN1 on TB6612FNG (digital, reverse direction)
    # MOT_EN  = E?_STEP pin → PWMA/PWMB on TB6612FNG (timer PWM, speed control)
    # MOT_FWD = E?_SPI_EN pin → AIN2/BIN2 on TB6612FNG (digital, forward direction)
    # TRG     = E?_ENDSTOP pin → PREP sensor (D2F-L) — bundled in 4-wire spooler cable
    MOT1_RWD=PD28, MOT1_FWD=PD23, MOT1_EN=PD2,   # Lane 1 → E2 group (DIR, SPI_EN, STEP)
    MOT2_RWD=PD22, MOT2_FWD=PD24, MOT2_EN=PD1,   # Lane 2 → E3 group (DIR, SPI_EN, STEP)
    MOT3_RWD=PD16, MOT3_FWD=PD25, MOT3_EN=PD0,   # Lane 3 → E4 group (DIR, SPI_EN, STEP)
    MOT4_RWD=PD17, MOT4_FWD=PD26, MOT4_EN=PD3,   # Lane 4 → E5 group (DIR, SPI_EN, STEP)

    # ── Filament Sensors ─────────────────────────────────────────────────────────
    # On-board STOP connectors are 2-pin (Signal + GND only) — NO VCC pin. Use passive mechanical switches
    # (D2HW, D2HW-C201H). Pull-up is provided by Klipper software (^ prefix) — no external VCC needed.
    # HUB uses E1 STOP connector; TurtleNeck uses E6 expansion group (Signal + GND only, pull-up via ^)
    HUB=PC16,                                        # E1 STOP connector
    TN_ADV=PD27, TN_TRL=PB14,                        # E6_STEP / E6_SPI_EN — expansion connector (E6 group)
    # PREP sensors use E?_ENDSTOP pins — bundled in 4-wire spooler cable (motor A/B + PREP + GND)
    TRG1=PE0,  TRG2=PE1,  TRG3=PE2,  TRG4=PE3,    # PREP gate switches (D2F-L) — E2/E3/E4/E5 ENDSTOP
    # LOAD sensors use motor slot endstop connectors — NEMA14 cable + LOAD sensor share same route
    EXT1=PD10, EXT2=PC14, EXT3=PA2,  EXT4=PD29,    # LOAD sensors (D2HW-C201H) — E0/X/Y/Z STOP connectors
    SW1=PC16, SW2=PE0,  SW3=PE1,  SW4=PE2,  SW5=PE3,
    SW7=PD27, SW8=PB14, SW9=PD10, SW10=PC14, SW11=PA2,  SW12=PD29,

    # ── RGB LEDs ─────────────────────────────────────────────────────────────────
    RGB1=PC0,   # E6_DIR — Neopixel data, chain=4 (4 lane indicator LEDs, always connected)
    RGB2=PC18,  # SPI0_CS2 — Corner LED data pin (Optional — BoxTurtle frame corner mod)
    RGB3=PC19,  # SPI0_CS3 — Frame accent LED data pin (Optional)
    RGB4=PC20,  # SPI0_CS4 — Enclosure LED data pin (Optional — BoxTurtle Enclosure mod)

    # ── Fan / Heater ─────────────────────────────────────────────────────────────
    FAN0=PC23,   # Digital output — used by [output_pin hub_fan]; on/off auto-control via MCU temp (>= 40°C ON); V_FAN jumper set to 5V for 3010 5V hub fan
    FAN1=PC26,   # Digital output — used by [output_pin turtle_fan_duet]; on/off auto-control via MCU temp (>= 45°C ON)
    FAN2=PA0,    # Hardware PWM output — reserved for dryer circulation fan (see commented [fan_generic dryer_fan])
    ENCL_HEAT=PA19,  # BED_HEAT — high-current MOSFET (HEATBED screw terminal) — easier to identify, higher power
    ENCL_TEMP=PC13,  # BED_TEMP — thermistor input (THERM0 connector, labeled BED TEMP on board)
    ELEC_TEMP=PC12   # E1_TEMP  — thermistor input near Turtle_1 electronics area (Optional)

# ════════════════════════════════════════════════════════════════════════════════
# WIRING REFERENCE — Box Turtle / Duet 2 WiFi (all revisions v1.00-v1.04)
# All pins verified against official Duet firmware Pins_DuetNG.h
# ════════════════════════════════════════════════════════════════════════════════
#
# ── All Pins — Quick Reference ───────────────────────────────────────────────
#
#   Alias          Pin   Connector / Label          Function
#   ─────────────────────────────────────────────────────────────────────────────
#   M1_STEP        PD4   E1 → STEP                  Lane 1 stepper step
#   M1_DIR         PD9   E1 → DIR                   Lane 1 stepper dir
#   M1_CS          PC25  E1 → SPI_EN                Lane 1 TMC2660 CS
#   M2_STEP        PD6   X  → STEP                  Lane 2 stepper step
#   M2_DIR         PD11  X  → DIR                   Lane 2 stepper dir
#   M2_CS          PD14  X  → SPI_EN                Lane 2 TMC2660 CS
#   M3_STEP        PD7   Y  → STEP                  Lane 3 stepper step
#   M3_DIR         PD12  Y  → DIR                   Lane 3 stepper dir
#   M3_CS          PC9   Y  → SPI_EN                Lane 3 TMC2660 CS
#   M4_STEP        PD8   Z  → STEP                  Lane 4 stepper step
#   M4_DIR         PD13  Z  → DIR                   Lane 4 stepper dir
#   M4_CS          PC10  Z  → SPI_EN                Lane 4 TMC2660 CS
#   M?_EN (all)    PC6   TMC_EN (shared)             All steppers enable, active low
#   ─────────────────────────────────────────────────────────────────────────────
#   MOT1_RWD       PD28  Expansion E2_DIR            N20 L1 reverse (digital → AIN1)
#   MOT1_FWD       PD23  Expansion E2_SPI_EN         N20 L1 forward (digital → AIN2)
#   MOT1_EN        PD2   Expansion E2_STEP           N20 L1 speed   (PWM    → PWMA)
#   MOT2_RWD       PD22  Expansion E3_DIR            N20 L2 reverse (digital → BIN1)
#   MOT2_FWD       PD24  Expansion E3_SPI_EN         N20 L2 forward (digital → BIN2)
#   MOT2_EN        PD1   Expansion E3_STEP           N20 L2 speed   (PWM    → PWMB)
#   MOT3_RWD       PD16  Expansion E4_DIR            N20 L3 reverse (digital → AIN1)
#   MOT3_FWD       PD25  Expansion E4_SPI_EN         N20 L3 forward (digital → AIN2)
#   MOT3_EN        PD0   Expansion E4_STEP           N20 L3 speed   (PWM    → PWMA)
#   MOT4_RWD       PD17  Expansion E5_DIR            N20 L4 reverse (digital → BIN1)
#   MOT4_FWD       PD26  Expansion E5_SPI_EN         N20 L4 forward (digital → BIN2)
#   MOT4_EN        PD3   Expansion E5_STEP           N20 L4 speed   (PWM    → PWMB)
#   ─────────────────────────────────────────────────────────────────────────────
#   HUB            PC16  E1 STOP (Signal+GND)        Hub switch (D2HW, NO)
#   EXT1           PD10  E0 STOP (Signal+GND)        LOAD sensor L1 (D2HW-C201H, NO)
#   EXT2           PC14  X  STOP (Signal+GND)        LOAD sensor L2 (D2HW-C201H, NO)
#   EXT3           PA2   Y  STOP (Signal+GND)        LOAD sensor L3 (D2HW-C201H, NO)
#   EXT4           PD29  Z  STOP (Signal+GND)        LOAD sensor L4 (D2HW-C201H, NO)
#   TRG1           PE0   Expansion E2_ENDSTOP        PREP gate L1 (D2F-L, NC) — 4-wire cable
#   TRG2           PE1   Expansion E3_ENDSTOP        PREP gate L2 (D2F-L, NC) — 4-wire cable
#   TRG3           PE2   Expansion E4_ENDSTOP        PREP gate L3 (D2F-L, NC) — 4-wire cable
#   TRG4           PE3   Expansion E5_ENDSTOP        PREP gate L4 (D2F-L, NC) — 4-wire cable
#   TN_ADV         PD27  Expansion E6_STEP           TurtleNeck advance (D2F, NO)
#   TN_TRL         PB14  Expansion E6_SPI_EN         TurtleNeck trail   (D2F, NO) — free GPIO, no Duex5
#   ─────────────────────────────────────────────────────────────────────────────
#   RGB1           PC0   Expansion E6_DIR            Neopixel GRBW data (chain=4, bit-bang)
#   RGB2           PC18  SPI0_CS2                    Corner LED data (Optional — frame corner mod)
#   RGB3           PC19  SPI0_CS3                    Frame accent LED data (Optional)
#   RGB4           PC20  SPI0_CS4                    Enclosure LED data (Optional)
#   hub_fan        PC23  FAN0                        [output_pin] + delayed_gcode — on/off via MCU temp (ON >= 40°C)
#   turtle_fan_duet   PC26  FAN1                        [output_pin] + delayed_gcode — on/off via MCU temp (ON >= 45°C)
#   dryer_fan      PA0   FAN2                        [fan_generic] — dryer circulation (commented; enable with enclosure heater)
#   ENCL_HEAT      PA19  BED_HEAT (HEATBED terminal) Enclosure/dryer heater MOSFET (Optional)
#   ENCL_TEMP      PC13  BED_TEMP (THERM0 connector) Enclosure/dryer air thermistor (Optional)
#   ELEC_TEMP      PC12  E1_TEMP  (on-board)         Electronics area thermistor (Optional)
#
# ── NEMA14 Steppers (on-board motor connectors, TMC2660 SPI usart1, EN=!PC6) ──
#
#   Lane 1 → E1 connector   STEP=PD4  DIR=PD9  CS=PC25
#   Lane 2 → X  connector   STEP=PD6  DIR=PD11 CS=PD14
#   Lane 3 → Y  connector   STEP=PD7  DIR=PD12 CS=PC9
#   Lane 4 → Z  connector   STEP=PD8  DIR=PD13 CS=PC10
#
# ── Power Supply ─────────────────────────────────────────────────────────────
#
#   VIN (24V)  : POWER IN terminal — feeds Duet and buck converter input
#   6V         : Buck converter 24V → 6V — TB6612FNG VM (N20 motor supply)
#   5V         : Duet LED +5V header — Neopixel VCC
#   3.3V       : Duet expansion connector — TB6612FNG STBY
#
# ── N20 Respoolers (50-pin expansion connector → TB6612FNG → N20 6V 500RPM) ───
#
#   Two TB6612FNG modules (2 channels each).
#   VM = 6V (buck converter 24V→6V)   STBY = 3.3V (expansion connector)
#
#   Note: AFC only moves one lane at a time — at most 1 N20 is active at any moment.
#   The Duet 5V rail could theoretically power VM (one motor at ~200mA), but 5V is below
#   the 6V spec and the onboard regulator is sized for logic/peripherals. The external
#   buck converter is recommended: correct voltage + current drawn from VIN, not the Duet.
#
#   All 4 pins of each E2-E5 group are used per lane.
#   ENDSTOP pin carries PREP sensor — bundled in 4-wire cable: motor A/B + PREP signal + GND.
#
#   TB6612FNG #1 — Lanes 1 + 2
#   ┌─────────────┬──────────┬─────────────────────────────────────┐
#   │ TB6612FNG   │ Duet pin │ Expansion slot / function           │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ STBY        │ 3.3V exp │ Expansion 3.3V pin                  │
#   │ VM          │ 6V buck  │ Buck converter output               │
#   │ GND         │ GND exp  │ Expansion GND pin                   │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ AIN1 (L1)   │ PD28     │ E2_DIR    — MOT1_RWD (digital)     │
#   │ AIN2 (L1)   │ PD23     │ E2_SPI_EN — MOT1_FWD (digital)     │
#   │ PWMA (L1)   │ PD2      │ E2_STEP   — MOT1_EN  (timer PWM) ← │
#   │ AO1 / AO2   │  —       │ N20 Lane 1 motor wires              │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ BIN1 (L2)   │ PD22     │ E3_DIR    — MOT2_RWD (digital)     │
#   │ BIN2 (L2)   │ PD24     │ E3_SPI_EN — MOT2_FWD (digital)     │
#   │ PWMB (L2)   │ PD1      │ E3_STEP   — MOT2_EN  (timer PWM) ← │
#   │ BO1 / BO2   │  —       │ N20 Lane 2 motor wires              │
#   └─────────────┴──────────┴─────────────────────────────────────┘
#   E2_ENDSTOP (PE0) → TRG1 PREP sensor — 4-wire spooler cable L1
#   E3_ENDSTOP (PE1) → TRG2 PREP sensor — 4-wire spooler cable L2
#
#   TB6612FNG #2 — Lanes 3 + 4
#   ┌─────────────┬──────────┬─────────────────────────────────────┐
#   │ TB6612FNG   │ Duet pin │ Expansion slot / function           │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ STBY        │ 3.3V exp │ Expansion 3.3V pin                  │
#   │ VM          │ 6V buck  │ Buck converter output               │
#   │ GND         │ GND exp  │ Expansion GND pin                   │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ AIN1 (L3)   │ PD16     │ E4_DIR    — MOT3_RWD (digital)     │
#   │ AIN2 (L3)   │ PD25     │ E4_SPI_EN — MOT3_FWD (digital)     │
#   │ PWMA (L3)   │ PD0      │ E4_STEP   — MOT3_EN  (timer PWM) ← │
#   │ AO1 / AO2   │  —       │ N20 Lane 3 motor wires              │
#   ├─────────────┼──────────┼─────────────────────────────────────┤
#   │ BIN1 (L4)   │ PD17     │ E5_DIR    — MOT4_RWD (digital)     │
#   │ BIN2 (L4)   │ PD26     │ E5_SPI_EN — MOT4_FWD (digital)     │
#   │ PWMB (L4)   │ PD3      │ E5_STEP   — MOT4_EN  (timer PWM) ← │
#   │ BO1 / BO2   │  —       │ N20 Lane 4 motor wires              │
#   └─────────────┴──────────┴─────────────────────────────────────┘
#   E4_ENDSTOP (PE2) → TRG3 PREP sensor — 4-wire spooler cable L3
#   E5_ENDSTOP (PE3) → TRG4 PREP sensor — 4-wire spooler cable L4
#
# ── Filament Sensors ────────────────────────────────────────────────────────
#
#   On-board endstop connectors (Signal + GND only, pull-up via ^ in software):
#   HUB switch         (D2HW, NO)  : Signal=PC16 GND=E1 STOP GND pin → E1 STOP connector
#   LOAD sensor L1     (D2HW, NO)  : Signal=PD10 GND=E0 STOP GND pin → E0 STOP connector  ← NEMA14 L1 cable route
#   LOAD sensor L2     (D2HW, NO)  : Signal=PC14 GND=X  STOP GND pin → X  STOP connector  ← NEMA14 L2 cable route
#   LOAD sensor L3     (D2HW, NO)  : Signal=PA2  GND=Y  STOP GND pin → Y  STOP connector  ← NEMA14 L3 cable route
#   LOAD sensor L4     (D2HW, NO)  : Signal=PD29 GND=Z  STOP GND pin → Z  STOP connector  ← NEMA14 L4 cable route
#
#   50-pin expansion connector (Signal + GND from expansion GND pins):
#   PREP gate switches (D2F-L, NC) : L1=PE0  L2=PE1  L3=PE2  L4=PE3  (E2-E5 ENDSTOP — 4-wire spooler cable)
#   TurtleNeck ADV     (D2F,  NO)  : PD27   (E6_STEP — expansion connector)
#   TurtleNeck TRL     (D2F,  NO)  : PB14   (E6_SPI_EN  — expansion connector, free GPIO, no Duex5)
#
# ── LEDs and Fan ─────────────────────────────────────────────────────────────
#
#   RGB Neopixel GRBW (chain=4)  : DATA=PC0  (RGB1, E6_DIR) — all 4 lane LEDs in series
#                                  VCC=5V from Duet LED +5V header
#                                  GND=Duet LED +5V header GND pin
#   hub_fan [output_pin]        : PC23 (FAN0) — on/off via MCU temp, ON >= 40°C (delayed_gcode every 10s); toggle in Mainsail
#   turtle_fan_duet [output_pin]: PC26 (FAN1) — on/off via MCU temp, ON >= 45°C (delayed_gcode every 10s); toggle in Mainsail
#   dryer_fan [fan_generic]      : PA0  (FAN2) — dryer circulation fan, commented out (enable with enclosure heater)
#
# ── Available Pins (unused — verified against Pins_DuetNG.h) ─────────────────
#
#   E0 slot (on-board motor connector — not used by this build):
#     PD5  E0_STEP   GPIO output
#     PA1  E0_DIR    GPIO output
#     PC17 E0_SPI_EN GPIO output
#
#   50-pin expansion:
#     PA17 E6_ENDSTOP GPIO — free
#
#   Heater outputs (MOSFET-driven — suitable for DC loads, not logic signals):
#     PA20 E0_HEAT   PA16 E1_HEAT   PC3  E2_HEAT
#     PC5  E3_HEAT   PC8  E4_HEAT   PC11 E5_HEAT   PA15 E6_HEAT
#     [PA19 BED_HEAT → assigned to ENCL_HEAT alias — HEATBED screw terminal]
#
#   Thermistor inputs (ADC — analog sensors, NTC):
#     PC15 E0_TEMP   PC29 E2_TEMP   PC30 E3_TEMP   PC31 E4_TEMP   PC27 E5_TEMP   PA18 E6_TEMP
#     [PC13 BED_TEMP → assigned to ENCL_TEMP alias — THERM0 connector]
#     [PC12 E1_TEMP  → assigned to ELEC_TEMP alias — electronics area thermistor (Optional)]
#
#   Misc connectors:
#     PC1  ZProbe_IN      PD15 PS_ON         PC2  LED_ONBOARD
#     PC24 SPI0_CS0       PB2  SPI0_CS1      PA24 SPI0_CS5
#     [PC18/PC19/PC20 → assigned to RGB2/3/4 aliases — optional extra Neopixel chains]
#     PA7  ENC_SW         PA8  ENC_A         PC7  ENC_B
#     PD18 LCD_DB7        PD19 LCD_DB6       PD20 LCD_DB5
#     PD21 LCD_DB4        PC28 LCD_RS        PA25 LCD_E
#
# ════════════════════════════════════════════════════════════════════════════════
